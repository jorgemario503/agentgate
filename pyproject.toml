[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. NOT the import name: consumers still write
# `from core.handoff import ...` because the top-level package is `core`.
# "agentgate" is taken on PyPI by an unrelated project (bestagents/omniagents),
# so the distribution is published under its own name (DEC-401 follow-up).
name = "agentgaterunner"
version = "0.3.0"
description = "Open-model agent runners with platform bots, plus the handoff contract consumed by agentorchestrator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

# The handoff surface (core.handoff) is deliberately stdlib-only: it must be
# installable into agentorchestrator without dragging in the bot stack. These are
# the dependencies of the *runners and bots*, which an orchestrator deployment does
# not need. Setuptools cannot express "extras for the app but not the library", so
# they are declared here for a source install and kept out of the library path by
# the fact that core.handoff imports none of them (asserted by tests).
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # httpx: the local runner's transport.
    "httpx>=0.27",
    # openai: the deepinfra and fireworks runners import AsyncOpenAI at module level,
    # so shipping those runners makes this a hard requirement of the package.
    "openai>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
# Everything needed to actually run AgentGate's bots and runners.
#
# openai is NOT repeated here: it is a base dependency (the deepinfra and fireworks
# runners import it at module level, and both ship in the wheel).
full = [
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
    "python-telegram-bot>=21.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "claude-agent-sdk>=0.1.0",
    "agentdatabase>=0.7.0",
]
test = ["pytest>=9.0", "pytest-asyncio>=1.0"]

[project.urls]
Homepage = "https://github.com/jorgemario503/agentgate"

[tool.setuptools]
# Ship what agentorchestrator consumes. Two consumers now, with different needs:
#
#   * core.handoff  -- the wire contract. Narrow on purpose; see
#                      docs/runner-surface-contract.md.
#   * runners + the core subpackages they import -- the open-model execution
#                      harness (AgentDB, skills, reasoning, tool/context
#                      management). Decided in DEC-1102: the orchestrator
#                      imports these rather than copying or simulating them.
#
# core is listed because its subpackages hang off it. bots/ is deliberately
# NOT shipped: the orchestrator has its own platform adapter, and AgentGate's
# bot stack must not become a dependency of a second product.
#
# core.context ships because the runners import it; artifacts, cache_key,
# tool_pipeline and tool_compression live inside it after the M1 grouping.
#
# core.orchestration is kept ONLY as a deprecated alias (removed in 0.4.0).
packages = [
    "core",
    "core.handoff",
    "core.orchestration",
    "core.context",
    "core.reasoning",
    "core.skills",
    "core.tools",
    "runners",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

# NOTE on wheel contents: `core` ships as a whole package, so the wheel also contains
# bot-stack modules (agentdb, commands, sessions...). With runners/ shipped those are no
# longer dead weight -- the runners import agentdb, approvals, config, prompts, providers
# and sessions directly. See docs/runner-surface-contract.md section 3.1 for the measured
# list; a test keeps that list and this package set honest.

[tool.setuptools.package-data]
# The schema JSON is not loaded at runtime (validators are hand-written Python),
# but the drift tests read it. Without shipping these, agentorchestrator cannot run
# the drift check that makes vendoring safe (DEC-402 / DEC-406).
"core.handoff" = ["schemas/*.json"]
